<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="50%" stop-color="#2a5286" />
      <stop offset="100%" stop-color="#5b9bd5" />
    </linearGradient>

    <!-- Warm Accent Gradient for Text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8943a" />
    </linearGradient>
    
    <!-- Cloud Filter -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="300" fill="url(#skyGrad)" rx="16" />

  <!-- Animated Clouds (Back) -->
  <g fill="#ffffff" opacity="0.1" filter="url(#blur)">
    <circle cx="100" cy="80" r="40">
      <animate attributeName="cx" from="-100" to="1300" dur="40s" repeatCount="indefinite" />
    </circle>
    <circle cx="160" cy="60" r="50">
      <animate attributeName="cx" from="-40" to="1360" dur="40s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="150" r="60">
      <animate attributeName="cx" from="-100" to="1300" dur="30s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="120" r="70">
      <animate attributeName="cx" from="-20" to="1380" dur="30s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Clouds (Front) -->
  <g fill="#ffffff" opacity="0.15" filter="url(#blur)">
    <path d="M-50,200 Q-20,170 10,200 Q40,180 70,210 Q40,230 -50,230 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1300 0" dur="25s" repeatCount="indefinite" />
    </path>
    <path d="M-150,100 Q-120,70 -90,100 Q-60,80 -30,110 Q-60,130 -150,130 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1500 0" dur="35s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Subtle wind lines -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.2">
    <line x1="-100" y1="120" x2="-20" y2="120">
      <animate attributeName="x1" from="-100" to="1300" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" from="-20" to="1380" dur="8s" repeatCount="indefinite" />
    </line>
    <line x1="-200" y1="220" x2="-140" y2="220">
      <animate attributeName="x1" from="-200" to="1400" dur="12s" repeatCount="indefinite" />
      <animate attributeName="x2" from="-140" to="1460" dur="12s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Main Typography -->
  <text x="600" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    AtmoCraft
  </text>
  
  <text x="600" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="url(#textGrad)" text-anchor="middle" letter-spacing="1" opacity="0.9">
    One portal to train, learn and grow.
  </text>

  <!-- SIH Tag -->
  <rect x="530" y="235" width="140" height="30" rx="15" fill="#e8943a" opacity="0.9" />
  <text x="600" y="255" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    SIH 2026
  </text>
</svg>
